<h2>If you only memorise ten things</h2>
<ol>
<li><b>Financial reporting</b> provides the information; <b>financial statement analysis</b> uses it (plus other information) to make a decision.</li>
<li>Framework phases: Purpose → Collect → Process → Analyze → Conclude/Communicate → Follow-up.</li>
<li>Audits give <b>reasonable</b>, never absolute, assurance. Opinions: unqualified, qualified, adverse, disclaimer.</li>
<li>Standard-setters (IASB, FASB, AcSB) <b>set</b>; regulators (SEC, CSA) <b>recognise and enforce</b>. IOSCO is neither; it is an association.</li>
<li>Fundamental characteristics: <b>relevance</b> (incl. materiality) and <b>faithful representation</b> (complete, neutral, free from error).</li>
<li>Enhancing characteristics: comparability, verifiability, timeliness, understandability. Trade-offs happen <b>among these</b> (e.g., timeliness vs. verifiability).</li>
<li>Assumptions: <b>accrual accounting</b> and <b>going concern</b>.</li>
<li>Revenue: 5 steps. Steps 3–4 fix the <b>amount</b>, step 5 fixes the <b>timing</b>.</li>
<li>Rising prices: FIFO gives the lowest COGS (highest profit, highest ending inventory); LIFO the reverse; LIFO is not allowed under IFRS.</li>
<li>Financial reports do <b>not</b> show the value of a company; they help users <b>estimate</b> it.</li>
</ol>
<div class="warn"><b>Coverage note.</b> The Chapter 3 learning outcomes also list non-recurring items, earnings per share (basic and diluted), common-size income statements, and comprehensive income, but the slides in your folder stop after expense recognition. Those topics are not in this guide because they are not in your PDFs. If they are on your exam, you will need the remaining Chapter 3 slides.</div>`},

{id:'s1',tab:'★ 1 Analysis',title:'1 · What Financial Statement Analysis Is, and the Framework',meta:'Chapter 1 · 15 minutes · priority',
outline:[{t:'Financial analysis',c:[{t:'Examine performance in industry + economic context',c:[{t:'Goal: a decision or recommendation'}]},{t:'Central focus',c:[{t:'Return on capital ≥ cost of capital'},{t:'Grow operations profitably'},{t:'Generate cash for obligations and opportunities'}]}]},
{t:'Two kinds of capital providers',c:[{t:'Debt investor: interest and principal repaid?'},{t:'Equity investor: dividends and share price growth?'}]},
{t:'Reporting vs. analysis',c:[{t:'Reporting: company provides information'},{t:'Analysis: analyst evaluates and decides'}]},
{t:'Framework: six phases',c:[{t:'1 Purpose and context'},{t:'2 Collect input data'},{t:'3 Process data',c:[{t:'Adjusted statements, common-size, ratios, forecasts'}]},{t:'4 Analyze / interpret'},{t:'5 Conclude and communicate'},{t:'6 Follow-up'}]}],
cues:['What is financial analysis?','What does a debt investor care about vs. an equity investor?','What is the "central focus" of financial analysis?','How does financial reporting differ from financial statement analysis?','Name three economic decisions analysis supports.','What are the six framework phases, in order?','Which phase produces common-size statements and ratios?'],
notes:`<h3>Financial analysis</h3>
<p>**Financial analysis** is examining a company's performance <i>in the context of its industry and economic environment</i> in order to reach a decision or recommendation. The classic decision is whether to provide capital, in debt or equity, and at what price.</p>
<ul><li>An investor in **debt securities** cares about the company's ability to <b>pay interest and repay principal</b>.</li>
<li>An investor in **equity** cares about the ability to <b>pay dividends</b> and the likelihood the <b>share price will rise</b>.</li></ul>
<div class="box"><b>Central focus (know this sentence):</b> can the company earn a return on its capital at least equal to the <b>cost of that capital</b>, <b>profitably grow</b> its operations, and <b>generate sufficient cash</b> to meet obligations and pursue opportunities?</div>
<h3>Financial reporting vs. financial statement analysis</h3>
<div class="tw-wrap"><table><tr><th></th><th>Financial reporting (statements)</th><th>Financial statement analysis</th></tr>
<tr><td>Who</td><td>The company</td><td>The analyst</td></tr>
<tr><td>Role</td><td>Provide information about performance, financial position, and changes in financial position, useful to a wide range of users</td><td>Use those reports <b>combined with other information</b> to evaluate past, current, and potential performance and position</td></tr>
<tr><td>End use</td><td>Supports economic decisions</td><td>Makes investment, credit, and other economic decisions</td></tr></table></div>
<h3>Economic decisions it supports</h3>
<ul><li>Evaluating an equity investment for a portfolio; valuing a security for a recommendation</li><li>Evaluating a merger or acquisition candidate, or a subsidiary or division</li><li>Venture capital or other private equity investments</li><li>Judging <b>creditworthiness</b> for a loan and its terms; extending credit to a customer</li><li>Checking compliance with <b>debt covenants</b>; assigning a debt rating</li><li>Forecasting future net income and cash flow</li></ul>
<h3>The Financial Statement Analysis Framework</h3>
<div class="tw-wrap"><table><tr><th>Phase</th><th>Sources of information</th><th>Output</th></tr>
<tr><td><b>1. Articulate the purpose and context</b></td><td>Nature of the analyst's function (equity, debt, credit rating); client or supervisor needs; institutional guidelines</td><td>Statement of purpose; list of specific questions; nature of the report; timetable and budget</td></tr>
<tr><td><b>2. Collect input data</b></td><td>Financial statements, other financial data, questionnaires, industry/economic data; talks with management, suppliers, customers, competitors; site visits</td><td>Organized financial statements; financial data tables; completed questionnaires</td></tr>
<tr><td><b>3. Process data</b></td><td>Data from the previous phase</td><td><b>Adjusted financial statements, common-size statements, ratios and graphs, forecasts</b></td></tr>
<tr><td><b>4. Analyze / interpret the processed data</b></td><td>Input data and processed data</td><td>Analytical results</td></tr>
<tr><td><b>5. Develop and communicate conclusions and recommendations</b></td><td>Analytical results and previous reports; institutional guidelines for published reports</td><td>Analytical report answering the Phase 1 questions; a recommendation (invest? grant credit?)</td></tr>
<tr><td><b>6. Follow-up</b></td><td>Information gathered by periodically repeating the steps</td><td>Updated reports and recommendations</td></tr></table></div>
<p><b>Memory hook:</b> <i>P-C-P-A-C-F</i>: Purpose, Collect, Process, Analyze, Communicate, Follow-up. Typical exam trap: ratios and common-size statements are an output of <b>processing</b> (phase 3), not of analysis (phase 4).</p>`,
summary:'Financial statement analysis takes the reports a company publishes, adds outside information, and turns them into a decision such as whether to invest or lend. Debt investors look at repayment ability; equity investors look at dividends and share price growth. The work follows six ordered phases, starting with a clear purpose and ending with follow-up.',
qs:[['What is the role of financial statement analysis, as opposed to financial reporting?','Reporting is the company providing information about performance, financial position, and changes in position. Analysis is using those reports, combined with other information, to evaluate past, current, and potential performance and position in order to make investment, credit, and other economic decisions.'],
['List the six phases of the financial statement analysis framework in order.','1) Articulate the purpose and context; 2) Collect input data; 3) Process data; 4) Analyze/interpret the processed data; 5) Develop and communicate conclusions and recommendations; 6) Follow-up.'],
['An analyst computes ratios and builds common-size statements. Which phase is this, and what are the other outputs of that phase?','Phase 3, Process data. Its outputs are adjusted financial statements, common-size statements, ratios and graphs, and forecasts.'],
['A bank is deciding whether to lend to a manufacturer. Which investor perspective applies and what is the main concern?','The debt-investor (creditor) perspective: the company\'s ability to pay interest and repay the principal. This is a creditworthiness decision, which also determines the loan terms.'],
['State the central focus of financial analysis.','Evaluating the company\'s ability to earn a return on its capital at least equal to the cost of that capital, to profitably grow its operations, and to generate sufficient cash to meet obligations and pursue opportunities.']]},

{id:'s2',tab:'★ 2 Statements & Audit',title:'2 · The Financial Statements, Notes, MD&A and the Audit',meta:'Chapter 1 · 15 minutes · priority',
outline:[{t:'Information sources',c:[{t:'From the company',c:[{t:'Financial reports, press releases, conference calls, webcasts'}]},{t:'From outside',c:[{t:'Economic statistics, industry reports, competitor databases'}]}]},
{t:'Complete set of statements',c:[{t:'Statement of financial position (balance sheet)'},{t:'Statement of comprehensive income'},{t:'Statement of changes in equity'},{t:'Statement of cash flows'}]},
{t:'Supplementary information',c:[{t:'Notes: accounting policies, methods, estimates'},{t:'MD&A / management commentary: 5 contents'},{t:'Governance and corporate responsibility reports'}]},
{t:'Audit',c:[{t:'Reasonable, not absolute, assurance',c:[{t:'Because audits use sampling'}]},{t:'Four opinions',c:[{t:'Unqualified (clean)'},{t:'Qualified'},{t:'Adverse'},{t:'Disclaimer'}]}]},
{t:'Other sources',c:[{t:'Proxy statements'},{t:'Interim reports (unaudited)'}]}],
cues:['What four statements make up a complete set?','What goes in the notes, and why do analysts read them?','What five things should a decision-useful management commentary contain?','Why can an audit only give reasonable assurance?','What are the four audit opinions and when is each issued?','What is a proxy statement?','Are interim reports audited?'],
notes:`<h3>Where the information comes from</h3>
<ul><li><b>From the company:</b> financial reports, press releases, investor conference calls, webcasts. Reports come annually, semiannually and/or quarterly depending on the regulator.</li>
<li><b>From outside:</b> economic statistics, industry reports, trade publications, databases on competitors.</li>
<li>Financial statements are the result of an accounting process that records economic activities under the applicable standards, and they are almost always audited by independent accountants.</li></ul>
<h3>A complete set of financial statements</h3>
<div class="tw-wrap"><table><tr><th>Statement</th><th>What it tells the analyst</th></tr>
<tr><td>**Statement of financial position** (balance sheet)</td><td>Resources (assets) and claims on them (liabilities and equity) at a point in time</td></tr>
<tr><td>**Statement of comprehensive income**</td><td>Performance over a period. Either one single statement, or an **income statement** plus a separate statement of comprehensive income</td></tr>
<tr><td>**Statement of changes in equity**</td><td>How each component of owners' equity changed over the period</td></tr>
<tr><td>**Statement of cash flows**</td><td>Where cash came from and where it went</td></tr></table></div>
<p>Additional information in an annual report: a letter from the chairman, management's report (**MD&amp;A**), the external **auditor's report**, a **governance report** on the board's structure, and a corporate responsibility report.</p>
<p><i>[Figures: the slides show excerpts of Volkswagen's (IFRS) and Walmart's balance sheets, and Volkswagen's income statement, statement of comprehensive income, changes in equity, and cash flow statement. They are illustrations only.]</i></p>
<h3>Financial notes and supplementary schedules</h3>
<p>A company's significant accounting choices, meaning **policies, methods, and estimates**, must be discussed in the notes. Volkswagen's 2017 notes run over 100 pages and disclose, for example: fiscal year equals calendar year; prepared under IFRS as adopted by the EU and in compliance with German law; amounts in millions of euros, rounded; and prepared on a **consolidated basis** (Volkswagen AG plus all subsidiaries it controls).</p>
<h3>Management commentary / MD&amp;A</h3>
<p>Management discusses the nature of the business, past results, and future outlook. IFRS suggests a decision-useful **management commentary** contains:</p>
<ol><li>the nature of the business;</li><li>management's objectives and strategies;</li><li>the company's significant resources, risks, and relationships;</li><li>results of operations; and</li><li>critical performance measures.</li></ol>
<h3>Auditor's reports</h3>
<ul><li>**International Standards on Auditing (ISAs)** are developed by the **International Auditing and Assurance Standards Board (IAASB)**.</li>
<li>Audits use <b>sampling techniques</b>, so auditors cannot give absolute assurance.</li>
<li>The report gives **reasonable assurance** that the statements are <b>fairly presented</b>: a high probability they are free from <b>material</b> errors, fraud, or illegal acts.</li></ul>
<div class="tw-wrap"><table><tr><th>Opinion</th><th>Meaning</th></tr>
<tr><td>**Unqualified** (unmodified, "clean")</td><td>Statements give a "true and fair view" / are "fairly presented" under the applicable standards</td></tr>
<tr><td>**Qualified**</td><td>There is a scope limitation or an exception to accounting standards</td></tr>
<tr><td>**Adverse**</td><td>Statements materially depart from standards and are <b>not</b> fairly presented</td></tr>
<tr><td>**Disclaimer of opinion**</td><td>Auditors are unable to issue an opinion (e.g., a scope limitation)</td></tr></table></div>
<p><b>Memory hook:</b> unqualified is the <i>good</i> one. "Qualified" means "yes, except for…".</p>
<h3>Other sources</h3>
<ul><li>**Proxy statements:** sent to shareholders about matters to be voted on at the annual or special meeting, e.g., management and director compensation.</li>
<li>**Interim reports:** semiannual or quarterly; <b>unaudited</b>.</li>
<li>Company website, press releases, conference calls.</li></ul>`,
summary:'A full set of statements is the balance sheet, statement of comprehensive income, statement of changes in equity and cash flow statement, with notes that explain the accounting choices behind the numbers. Management adds its own commentary, and an independent auditor gives an opinion that offers reasonable, not absolute, assurance. Analysts also use proxy statements and unaudited interim reports.',
qs:[['Name the four statements in a complete set of financial statements.','Statement of financial position (balance sheet), statement of comprehensive income (single statement, or income statement plus statement of comprehensive income), statement of changes in equity, and statement of cash flows.'],
['Why do auditors provide only reasonable assurance?','Audits are designed and conducted using sampling techniques, so auditors do not examine everything and cannot express absolute assurance about accuracy or precision.'],
['An auditor concludes the statements materially depart from accounting standards and are not fairly presented. Which opinion is issued?','An adverse audit opinion.'],
['Distinguish a qualified opinion from a disclaimer of opinion.','A qualified opinion is still an opinion, but with a scope limitation or an exception to accounting standards noted. A disclaimer means the auditors are unable to issue any opinion, for example because of a scope limitation.'],
['Where would an analyst look to find a company\'s depreciation method and estimated useful lives, and where to find director compensation?','Depreciation method and estimates: the notes to the financial statements (and MD&A). Director and management compensation: the proxy statement.']]},

{id:'s3',tab:'3 Standards',title:'3 · Why Standards Exist, and Who Sets and Enforces Them',meta:'Chapter 2 · 10 minutes',
outline:[{t:'Objective of financial reporting',c:[{t:'Useful information for resource providers',c:[{t:'Investors: buy, sell, hold'},{t:'Lenders: lend or not, amount, terms'}]},{t:'Reports do not show value; they help estimate it'}]},
{t:'Why standards matter',c:[{t:'Economic reality is complex'},{t:'Complexity requires preparer judgment'},{t:'Judgment varies, so standards create consistency'},{t:'Estimates still remain (Incook example)'}]},
{t:'Who does what',c:[{t:'Standard-setting bodies set',c:[{t:'IASB → IFRS'},{t:'FASB → US GAAP'},{t:'AcSB → Canada'}]},{t:'Regulatory authorities recognise and enforce',c:[{t:'SEC (US)'},{t:'Financial Conduct Authority (UK)'},{t:'CSA (Canada)'}]},{t:'IOSCO: association of regulators, not a regulator'}]}],
cues:['What is the objective of financial reporting?','Do financial reports show what a company is worth?','Why are reporting standards needed at all?','What is the difference between a standard-setting body and a regulatory authority?','Who sets IFRS? US GAAP? Canadian standards?','What is IOSCO and what is it not?','In the Incook example, which numbers still require judgment?'],
notes:`<h3>The objective of financial reporting</h3>
<p>To provide financial information about the reporting entity that is <b>useful to users in making decisions about providing resources</b> to the entity, where those decisions relate to equity and debt instruments, or loans and other credit.</p>
<ul><li><b>Investors:</b> buy, sell, or hold.</li><li><b>Lenders and other creditors:</b> lend or not, and the amount and terms.</li></ul>
<p>Investor decisions depend on <b>expected returns</b> (dividend yield and price appreciation). Those depend on prospects for <b>future cash flows</b>, which require information about the entity's resources, claims to resources, and how management and the board use those resources.</p>
<div class="box"><b>Financial reports are not designed to show the value of a reporting entity.</b> They provide information to help users <i>estimate</i> the value.</div>
<h3>Why standards matter (the logic chain)</h3>
<ol><li>The complexity of standards reflects the complexity of the underlying economic reality.</li><li>Complexity and uncertainty create the need for <b>judgment</b> by preparers.</li><li>Judgment varies among preparers, so standards are needed for <b>consistency</b>.</li><li>Even with standards, preparers must still make judgments and use <b>estimates</b>.</li><li>An analyst who knows where judgments and estimates enter can make better use of the numbers.</li></ol>
<h3>Incook Inc. example</h3>
<p>Bought office equipment for $9,000 cash; paid $10,000 rent and miscellaneous; bought 100 cookware sets at $700; sold 60 sets at $1,200 ($72,000), of which $57,000 was collected and $15,000 is still owed.</p>
<p>Without standards, "profit" could be computed many ways. Standards <b>limit the range of allowable approaches</b>:</p>
<ul><li><b>Revenue: $72,000</b> (not the $57,000 cash collected), likely reduced by an estimate for <b>uncollectible accounts</b>.</li><li><b>Cost of goods sold: $42,000</b> (60 × $700). If unit costs differed, an <b>inventory cost method</b> would have to be chosen.</li><li><b>Equipment:</b> some expense for part of it, depending on estimated <b>useful life</b>, estimated <b>salvage value</b>, and the <b>depreciation method</b>.</li></ul>
<h3>Standard-setters vs. regulators</h3>
<div class="tw-wrap"><table><tr><th></th><th>Standard-setting bodies</th><th>Regulatory authorities</th></tr>
<tr><td>Job</td><td><b>Set</b> the standards</td><td><b>Recognize and enforce</b> the standards</td></tr>
<tr><td>Nature</td><td>Private sector, self-regulated organizations</td><td>Governmental entities</td></tr>
<tr><td>Examples</td><td>**IASB** (International Accounting Standards Board) → **IFRS**<br>**FASB** (US Financial Accounting Standards Board) → **US GAAP**<br>**AcSB** (Accounting Standards Board) → all Canadian entities outside the public sector</td><td>US: **SEC** (Securities and Exchange Commission)<br>UK: Financial Conduct Authority<br>Canada: **CSA** (Canadian Securities Administrators)</td></tr></table></div>
<ul><li>Regulators often <b>retain legal authority</b> to establish standards in their jurisdiction and can <b>overrule</b> the private-sector standard-setters.</li>
<li>Canada has <b>no federal, nationwide securities regulator</b>; the CSA coordinates to harmonize rules and oversee enforcement.</li></ul>
<div class="warn">The slide abbreviates the UK Financial Conduct Authority as "FSC". The usual abbreviation is FCA. If the exam uses the slide's wording, recognise it as the same body.</div>
<h3>IOSCO</h3>
<p>The **International Organization of Securities Commissions (IOSCO)** is <b>not a regulatory authority</b>. It is an international association of securities regulators formed in <b>1983</b>. Members aim to:</p>
<ul><li>develop international standards of market regulation to protect investors and address systemic risks;</li><li>exchange information and cooperate in <b>enforcement</b> to protect investors and promote confidence;</li><li>exchange information to help develop markets, infrastructure, and regulation.</li></ul>`,
summary:'Financial reporting exists to help investors and lenders decide whether to provide resources to a company; it helps them estimate value but does not state it. Standards are needed because preparers must use judgment and that judgment would otherwise vary. Private bodies such as the IASB and FASB write the standards, while government regulators such as the SEC and CSA enforce them.',
qs:[['What is the objective of financial reporting?','To provide financial information about the reporting entity that is useful to users in making decisions about providing resources to the entity, relating to equity and debt instruments or loans and other forms of credit.'],
['True or false: financial reports are designed to show the value of the reporting entity.','False. They are not designed to show value; they provide information that helps users estimate the value.'],
['Which body sets IFRS and which sets US GAAP? Who enforces standards in the US?','The IASB sets IFRS; the FASB sets US GAAP. The SEC, a governmental regulatory authority, recognises and enforces standards in the US.'],
['Is IOSCO a regulator? Explain.','No. It is an international association of securities regulators, formed in 1983, whose members cooperate on regulation standards, enforcement, and information exchange.'],
['In the Incook example, why is revenue $72,000 and not $57,000, and what estimate might reduce it?','Under accrual accounting revenue is recognised when earned (60 sets delivered at $1,200), not when cash is collected. It would likely be reduced by an estimate for uncollectible accounts (bad debts).']]},

{id:'s4',tab:'★ 4 Conceptual Framework',title:'4 · The Conceptual Framework: Characteristics, Elements, Assumptions',meta:'Chapter 2 · 20 minutes · highest priority theory',
outline:[{t:'Purpose of the Framework',c:[{t:'Helps standard setters, preparers, auditors, users'}]},
{t:'Qualitative characteristics',c:[{t:'Fundamental (2)',c:[{t:'Relevance',c:[{t:'Materiality'}]},{t:'Faithful representation',c:[{t:'Complete, neutral, free from error'}]}]},{t:'Enhancing (4)',c:[{t:'Comparability'},{t:'Verifiability'},{t:'Timeliness'},{t:'Understandability'}]}]},
{t:'Constraints',c:[{t:'Trade-offs among enhancing characteristics'},{t:'Benefits should exceed costs'},{t:'Non-quantifiable information is omitted'}]},
{t:'Elements',c:[{t:'Financial position: assets, liabilities, equity'},{t:'Performance: income, expenses'}]},
{t:'Underlying assumptions',c:[{t:'Accrual accounting'},{t:'Going concern'}]},
{t:'Recognition',c:[{t:'Meets element definition + recognition criteria'},{t:'Must give relevant and faithful information'}]}],
cues:['Who does the Conceptual Framework help, and how?','What are the two fundamental qualitative characteristics?','What three things make a representation "faithful"?','What are the four enhancing characteristics?','Which characteristics get traded off? Give the bad-debt example.','Define asset, liability, and equity.','Define income and expenses. What do they exclude?','What are the two underlying assumptions?','When is an item recognised?'],
notes:`<h3>What the Framework is for</h3>
<p>The IFRS **Conceptual Framework** is designed to assist: <b>standard setters</b> in developing and reviewing standards; <b>preparers</b> in applying standards and handling issues no standard covers; <b>auditors</b> in forming an opinion; and <b>users</b> in interpreting the information.</p>
<p>Users need information about the company's:</p>
<ul><li>**financial position:** its resources and financial obligations;</li><li>**financial performance:** how and why the position changed in the past (useful for judging future changes);</li><li><b>cash:</b> how it obtained cash (selling, borrowing) and how it used it (expenses, equipment, dividends).</li></ul>
<h3>Qualitative characteristics of useful information</h3>
<div class="tw-wrap"><table><tr><th>Type</th><th>Characteristic</th><th>Meaning</th></tr>
<tr><td rowspan="2"><b>Fundamental</b></td><td>**Relevance**</td><td>The information would potentially affect or make a difference in users' decisions. Includes **materiality**: omission or misstatement could influence users' decisions.</td></tr>
<tr><td>**Faithful representation**</td><td>The information faithfully represents the economic phenomenon it claims to represent; ideally <b>complete, neutral, and free from error</b>.</td></tr>
<tr><td rowspan="4"><b>Enhancing</b></td><td>**Comparability**</td><td>Lets users identify and understand similarities and differences between items.</td></tr>
<tr><td>**Verifiability**</td><td>Different knowledgeable, independent observers would agree the information faithfully represents what it purports to.</td></tr>
<tr><td>**Timeliness**</td><td>Information is available to decision makers before they decide.</td></tr>
<tr><td>**Understandability**</td><td>Understandable to users with reasonable knowledge of business and economic activities who are willing to study it diligently.</td></tr></table></div>
<p><b>Memory hooks:</b> Fundamental = <i>R + F</i> ("<b>R</b>eal <b>F</b>oundation"). Enhancing = <i>CVTU</i> ("<b>C</b>an <b>V</b>erify <b>T</b>his, <b>U</b>nderstood?").</p>
<h3>Constraints on financial reports</h3>
<ul><li>Ideally statements show all characteristics, but **tradeoffs** may be necessary <b>across the enhancing characteristics</b>. The aim is an appropriate balance.</li>
<li><b>Cost constraint:</b> benefits of information should exceed the costs of providing and using it.</li>
<li>Statements necessarily omit <b>non-quantifiable</b> information: customer loyalty, a positive corporate culture, environmental responsibility.</li></ul>
<div class="box"><b>Worked example (and the slide's quiz question).</b> When a company records sales revenue it must also estimate and record an expense for potential bad debts. This is relevant and a faithful representation, and it is timely and understandable. But bad debts are not known with certainty until later, so it <b>sacrifices verifiability</b>.<br><br><i>"Companies are most likely to make tradeoffs between which of the following?"</i> A) Relevance and materiality · B) Timeliness and verifiability · C) Relevance and faithful representation. <b>Answer: B.</b> Trade-offs are made among enhancing characteristics; A and C involve the fundamental ones (and materiality is part of relevance). The slide does not print the answer, but it follows directly from the constraint above.</div>
<h3>The elements of financial statements</h3>
<div class="tw-wrap"><table><tr><th>Measures</th><th>Element</th><th>Definition</th></tr>
<tr><td rowspan="3"><b>Financial position</b></td><td>**Assets**</td><td>A present economic resource <b>controlled</b> by the entity as a result of <b>past events</b>. An economic resource is a right with the potential to produce economic benefits. (What a company <i>owns</i>: inventory, equipment.)</td></tr>
<tr><td>**Liabilities**</td><td>A present <b>obligation</b> to transfer an economic resource as a result of past events. An obligation is a duty the entity has <b>no practical ability to avoid</b>. (What a company <i>owes</i>: bank borrowings.)</td></tr>
<tr><td>**Equity**</td><td>Assets less liabilities; the <b>residual interest</b>. Also "shareholders' equity" or "stockholders' equity".</td></tr>
<tr><td rowspan="2"><b>Performance</b></td><td>**Income**</td><td>Increases in assets, or decreases in liabilities, that increase equity, <b>other than contributions from holders of equity claims</b>. Includes <b>revenues</b> and <b>gains</b>.</td></tr>
<tr><td>**Expenses**</td><td>Decreases in assets, or increases in liabilities, that decrease equity, <b>other than distributions to holders of equity claims</b>. Includes operating expenses (cost of goods sold, wages, rent) and <b>losses</b> (sales below carrying value, impairments).</td></tr></table></div>
<p>So issuing shares is not income, and paying a dividend is not an expense.</p>
<h3>Underlying assumptions</h3>
<ul><li>**Accrual accounting:** statements reflect transactions in the period they <b>actually occur</b>, not necessarily when cash moves.</li>
<li>**Going concern:** the company will continue in business for the foreseeable future.</li></ul>
<h3>Recognition</h3>
<p>**Recognition** means an item is included in the balance sheet or income statement. It occurs if the item <b>meets the definition of an element</b> and <b>satisfies the recognition criteria</b>. It is appropriate when it gives both <b>relevant information</b> and a <b>faithful representation</b> of assets, liabilities, equity, income, and expenses.</p>`,
summary:'The Conceptual Framework says information is useful when it is relevant and faithfully represented, and more useful still when it is comparable, verifiable, timely and understandable. Preparers sometimes have to trade one enhancing quality for another. The framework also defines the five building blocks of the statements and assumes accrual accounting and a going concern.',
qs:[['Name the two fundamental and the four enhancing qualitative characteristics.','Fundamental: relevance (including materiality) and faithful representation. Enhancing: comparability, verifiability, timeliness, understandability.'],
['What three qualities does a faithful representation ideally have?','It is complete, neutral, and free from error.'],
['Recording an estimated bad-debt expense with each sale sacrifices which characteristic, and why is it done anyway?','Verifiability, because actual bad debts are not known with certainty until later. It is done because the estimate makes the information relevant, faithfully representative, and timely.'],
['A company issues new shares for $1 million cash. Assets increased and equity increased. Is this income? Why?','No. Income excludes increases in equity that relate to contributions from holders of equity claims.'],
['Define a liability and explain what "obligation" means.','A liability is a present obligation of the entity to transfer an economic resource as a result of past events. An obligation is a duty or responsibility the entity has no practical ability to avoid.'],
['State the two underlying assumptions and what each means.','Accrual accounting: transactions are reflected in the period they actually occur, not necessarily when cash moves. Going concern: the company will continue in business for the foreseeable future.']]},

{id:'s5',tab:'★ 5 Measurement & IFRS',title:'5 · Measurement Bases, IFRS General Requirements, IFRS vs. US GAAP',meta:'Chapter 2 · 12 minutes · priority',
outline:[{t:'Measurement bases',c:[{t:'Historical cost'},{t:'Amortized cost'},{t:'Current cost'},{t:'Realizable (settlement) value'},{t:'Present value'},{t:'Fair value'}]},
{t:'General requirements',c:[{t:'Required statements',c:[{t:'Four statements + notes'}]},{t:'General features (8)',c:[{t:'Fair presentation, going concern, accrual basis'},{t:'Materiality and aggregation, no offsetting'},{t:'Frequency, comparative information, consistency'}]},{t:'Structure and content',c:[{t:'Classified balance sheet'},{t:'Minimum information on face and in notes'},{t:'Comparative information'}]}]},
{t:'IFRS vs. US GAAP',c:[{t:'Principles vs. rules'},{t:'LIFO, development costs, inventory reversals'}]},
{t:'Monitoring developments',c:[{t:'Analyst = user perspective, not preparer'}]}],
cues:['What is measurement?','How does historical cost differ from current cost?','What is realizable value vs. present value?','Define fair value.','What are the eight general features of IFRS statements?','What is a classified balance sheet and who is exempt?','Name four IFRS vs. US GAAP differences.','Why must an analyst monitor standards?'],
notes:`<h3>Measurement of financial statement elements</h3>
<p>**Measurement** is determining the monetary amounts at which elements are recognised and carried in the balance sheet and income statement.</p>
<div class="tw-wrap"><table><tr><th>Basis</th><th>For assets</th><th>For liabilities</th></tr>
<tr><td>**Historical cost**</td><td>Cash paid to purchase the asset, <b>including acquisition and preparation costs</b></td><td>Proceeds received in exchange for the obligation</td></tr>
<tr><td>**Amortized cost**</td><td colspan="2">Historical cost adjusted for amortization, depreciation, or depletion and/or impairment</td></tr>
<tr><td>**Current cost**</td><td>Cash that would have to be paid to <b>buy the same or an equivalent asset today</b></td><td><b>Undiscounted</b> cash required to settle the obligation today</td></tr>
<tr><td>**Realizable (settlement) value**</td><td>Realizable value: cash obtainable by <b>selling</b> the asset in an orderly disposal</td><td>Settlement value: <b>undiscounted</b> cash expected to be paid in the normal course of business</td></tr>
<tr><td>**Present value (PV)**</td><td><b>Discounted</b> value of future net cash inflows the asset is expected to generate</td><td><b>Discounted</b> value of future net cash outflows required to settle</td></tr>
<tr><td>**Fair value**</td><td colspan="2">The price that would be received to sell an asset or paid to transfer a liability in an <b>orderly transaction between market participants at the measurement date</b>. May use market measures or present value measures.</td></tr></table></div>
<p><b>Quick tells:</b> "paid originally" = historical; "to replace today" = current cost; "if sold today" = realizable; "discounted future cash flows" = present value; "orderly transaction between market participants" = fair value.</p>
<h3>General requirements for financial statements (IFRS)</h3>
<p><b>Required financial statements:</b> statement of financial position; statement of comprehensive income (single, or income statement + statement of comprehensive income); statement of changes in equity; statement of cash flows; <b>notes</b> summarising accounting policies and other disclosures; and, in certain cases, a statement of financial position from the earliest comparative period.</p>
<div class="tw-wrap"><table><tr><th>General feature</th><th>Requirement</th></tr>
<tr><td>**Fair presentation**</td><td>Faithful representation of the effects of transactions, other events, and conditions</td></tr>
<tr><td>**Going concern**</td><td>Prepared on a going-concern basis unless management intends to liquidate or cease trading</td></tr>
<tr><td>**Accrual basis**</td><td>All statements use accrual accounting <b>except cash flow information</b></td></tr>
<tr><td>**Materiality and aggregation**</td><td>Omissions or misstatements are material if they could, individually or collectively, influence users' economic decisions</td></tr>
<tr><td>**No offsetting**</td><td>Assets and liabilities, and income and expenses, are not offset unless an IFRS requires or permits it</td></tr>
<tr><td>**Frequency of reporting**</td><td>At least annually</td></tr>
<tr><td>**Comparative information**</td><td>Must include comparative information from the previous period</td></tr>
<tr><td>**Consistency**</td><td>Presentation and classification are usually retained from one period to the next</td></tr></table></div>
<p><b>Structure and content:</b></p>
<ul><li>**Classified statement of financial position:** the balance sheet must separate <b>current and non-current</b> assets and liabilities, unless a <b>liquidity-based</b> presentation is more relevant and reliable (e.g., a <b>bank</b> or similar financial institution).</li>
<li>Minimum specified information on the face of the statements and minimum specified note disclosures.</li>
<li>Comparative information for the previous period for all reported amounts, unless another standard says otherwise.</li></ul>
<h3>IFRS vs. US GAAP</h3>
<div class="tw-wrap"><table><tr><th>Basis</th><th>US GAAP</th><th>IFRS</th></tr>
<tr><td>Developed by</td><td>FASB</td><td>IASB</td></tr>
<tr><td>Based on</td><td><b>Rules</b></td><td><b>Principles</b></td></tr>
<tr><td>Inventory valuation</td><td>FIFO, <b>LIFO</b>, weighted average</td><td>FIFO and weighted average (<b>no LIFO</b>)</td></tr>
<tr><td>Extraordinary items</td><td>Shown below, at the bottom of the income statement</td><td>Not segregated in the income statement</td></tr>
<tr><td>Development cost</td><td>Treated as an <b>expense</b></td><td><b>Capitalized</b>, only if certain conditions are satisfied</td></tr>
<tr><td>Reversal of inventory write-downs</td><td><b>Prohibited</b></td><td>Permissible if specified conditions are met</td></tr></table></div>
<p>From Chapter 3, add one more: the **revaluation model** for property, plant and equipment is allowed under IFRS but <b>not permitted under US GAAP</b>.</p>
<h3>Monitoring developments</h3>
<p>Reporting standards keep evolving, so analysts must monitor developments and assess the implications for security analysis and valuation. This does not mean becoming an accountant: an accountant monitors from a <b>preparer's</b> perspective; an analyst monitors from a <b>user's</b> perspective.</p>`,
summary:'The same asset or liability can be measured several ways, from what was originally paid to what it would fetch in an orderly sale today, and analysts need to know which basis sits behind a number. IFRS sets eight general features every set of statements must meet, plus rules on layout. IFRS is principles-based and US GAAP is rules-based, and they differ on LIFO, development costs and inventory write-down reversals.',
qs:[['An asset is measured at the cash that would be needed to buy an equivalent asset today. Which basis is this?','Current cost.'],
['Define fair value.','The price that would be received to sell an asset or paid to transfer a liability in an orderly transaction between market participants at the measurement date. It may use market measures or present value measures.'],
['Which general feature is the one exception to the accrual basis?','Cash flow information: financial statements are prepared on the accrual basis except for cash flow information.'],
['Why might a bank not present a classified (current/non-current) balance sheet?','IFRS allows a liquidity-based presentation when it provides more relevant and reliable information, as in the case of a bank or similar financial institution.'],
['Company A (US GAAP) and Company B (IFRS) both incur development costs and both later see written-down inventory recover in value. How could their statements differ?','A must expense development costs and cannot reverse the inventory write-down. B may capitalise development costs if certain conditions are met and may reverse the write-down if specified conditions are met. B could therefore report higher assets and profit, which hurts comparability.']]},

{id:'s6',tab:'★ 6 Income Statement',title:'6 · Income Statement: Components and Format',meta:'Chapter 3 Part 1 · 12 minutes · priority',
outline:[{t:'Income statement basics',c:[{t:'Results over a period of time'},{t:'Revenue − Expenses = Net income'},{t:'Also called P&L, statement of operations/earnings'}]},
{t:'Who uses it',c:[{t:'Equity analysts: earnings feed valuation'},{t:'Fixed-income analysts: ability to pay debt'}]},
{t:'Components',c:[{t:'Revenue (net revenue)'},{t:'Expenses',c:[{t:'By nature'},{t:'By function'}]},{t:'Gains and losses'},{t:'Net income',c:[{t:'Split: parent vs. noncontrolling interests'}]}]},
{t:'Format',c:[{t:'Multi-step shows gross profit'},{t:'Single-step does not'},{t:'Operating profit vs. EBIT'}]}],
cues:['What is the basic income statement equation?','Why do equity and fixed-income analysts each read it?','What is net revenue?','What is the difference between revenue and a gain?','What is noncontrolling interest?','Nature vs. function: give an example of each.','What makes a statement "multi-step"?','Is operating profit the same as EBIT?'],
notes:`<h3>Basics</h3>
<p>The **income statement** presents the financial results of a company's business activities <b>over a period of time</b>. Ignoring gains and losses:</p>
<div class="box"><b>Revenue − Expenses = Net income</b></div>
<p>Other names: "statement of operations", "statement of earnings", "**profit and loss (P&amp;L) statement**". Under both IFRS and US GAAP it may be a separate statement followed by a statement of comprehensive income (which starts from profit or loss), or a section of a single statement of comprehensive income.</p>
<ul><li><b>Equity analysts</b> care because valuation models often use estimates of <b>earnings</b>.</li><li><b>Fixed-income analysts</b> examine the components, past and projected, to assess ability to make <b>promised debt payments</b>.</li></ul>
<p><i>[Figures: income statements of AB InBev (Belgium), Molson Coors (US) and Groupe Danone (France). The point of the slide: <b>different orderings of chronological information are common</b>, so check which column is the latest year.]</i></p>
<h3>Components</h3>
<ul><li>**Revenue** (sales, turnover): amounts charged for delivering goods or services in the <b>ordinary activities</b> of the business. Reported after adjustments such as cash or volume discounts; **net revenue** signals that it has been adjusted. For comparisons, the analyst may need other disclosures to find comparable revenue figures.</li>
<li>**Expenses:** outflows, depletions of assets, and incurrences of liabilities in the course of business.</li>
<li>**Net income** ("net earnings", "profit or loss", the "bottom line") sits at the bottom. Below it, companies show how much is attributable to the company itself and how much to **noncontrolling interests** (minority interests).</li></ul>
<h3>Consolidation and noncontrolling interest</h3>
<p>Companies **consolidate** subsidiaries they <b>control</b>: they include <b>all</b> of a subsidiary's revenues and expenses even if they own less than 100%. Noncontrolling interest is the portion of income that "belongs" to the minority shareholders of those subsidiaries rather than the parent.</p>
<h3>Gains and losses</h3>
<p>Net income also includes **gains** and **losses**, increases and decreases in economic benefits that <b>may or may not</b> arise in ordinary activities.</p>
<ul><li>A manufacturer sells its products → <b>revenue</b>, with the related costs shown separately as expenses.</li><li>The same manufacturer sells surplus land → a <b>gain or loss</b> = sale price − **carrying value** of the land.</li></ul>
<p>Because "income" includes revenue and gains and "expenses" includes ordinary expenses and losses, net income can be written three equivalent ways:</p>
<ol type="a"><li>income − expenses;</li><li>revenue + other income + gains − expenses;</li><li>(revenue − ordinary-activity expenses) + (other income − other expenses) + (gains − losses).</li></ol>
<h3>Presentation rules and groupings</h3>
<p>Under IFRS, <b>revenue, finance costs, and tax expense</b> must be shown separately on the face of the income statement. Expenses may be grouped:</p>
<div class="tw-wrap"><table><tr><th>Grouping</th><th>Idea</th><th>Example</th></tr>
<tr><td>**By nature**</td><td>What kind of cost it is</td><td>One "depreciation" line combining manufacturing equipment and administrative facilities</td></tr>
<tr><td>**By function**</td><td>What the cost was used for</td><td>"Cost of goods sold", which may include labour, materials, depreciation, some salaries and other direct sales-related expenses</td></tr></table></div>
<h3>Subtotals</h3>
<ul><li>**Gross profit** = revenue − the costs of delivering goods or services.</li><li>A statement that shows a gross profit subtotal uses a **multi-step format**; otherwise it is **single-step**.</li><li>**Operating profit** = gross profit − operating expenses (selling, general, administrative, research and development).</li><li>Operating profit is sometimes called **EBIT** (earnings before interest and taxes), but the two are <b>not necessarily the same</b>.</li></ul>`,
summary:'The income statement shows how much a company earned over a period: revenue minus expenses, plus gains and minus losses, equals net income. Revenue comes from the main business, while gains come from side activities such as selling spare land. Layout varies between companies, so analysts check how expenses are grouped and whether subtotals like gross profit are shown.',
qs:[['What distinguishes a multi-step income statement from a single-step one?','A multi-step format shows a gross profit subtotal (revenue minus the cost of delivering goods or services); a single-step format does not.'],
['A furniture maker sells a warehouse it no longer needs for more than its carrying value. How is this reported?','As a gain, not revenue, equal to the sale price minus the carrying value. It arises from a secondary activity, not the ordinary business of selling furniture.'],
['A parent owns 80% of a subsidiary it controls. How much of the subsidiary\'s revenue appears in the consolidated income statement, and how is the other 20% reflected?','100% of the subsidiary\'s revenues and expenses are consolidated. The 20% of income belonging to minority shareholders is shown as net income attributable to noncontrolling interests.'],
['Give an example of grouping expenses by nature and by function.','By nature: a single "depreciation" line covering both manufacturing equipment and administrative facilities. By function: "cost of goods sold", combining labour, materials, depreciation and other direct costs.'],
['Which three items must IFRS companies present separately on the face of the income statement?','Revenue, finance costs, and tax expense.']]},

{id:'s7',tab:'★ 7 Revenue',title:'7 · Revenue Recognition',meta:'Chapter 3 Part 1 · 14 minutes · priority',
outline:[{t:'Principle',c:[{t:'Recognise when earned, not when cash moves'},{t:'Accounts receivable vs. unearned revenue'}]},
{t:'Five-step model',c:[{t:'1 Identify contract'},{t:'2 Identify performance obligations'},{t:'3 Determine transaction price'},{t:'4 Allocate price to obligations'},{t:'5 Recognise when/as obligation satisfied'}]},
{t:'Control at a point in time: five factors'},
{t:'Builder Co. examples',c:[{t:'Ex 1: one combined performance obligation'},{t:'Ex 2: over time, 60% → $600,000'},{t:'Ex 3: variable bonus not recognised'},{t:'Ex 4: modification → $91,200 catch-up'}]},
{t:'Principal vs. agent',c:[{t:'Principal reports gross'},{t:'Agent reports net (commission)'}]}],
cues:['How does IFRS define income?','When is revenue recognised under accrual accounting?','Accounts receivable vs. unearned revenue?','What are the five steps? Which set amount and which set timing?','What five factors show the customer has control?','When is a good or service "distinct"?','How is revenue measured for an obligation satisfied over time?','When can variable consideration be recognised?','Principal or agent: how do you tell, and what gets reported?'],
notes:`<h3>Definitions</h3>
<p>IFRS: "**Income** is increases in economic benefits during the accounting period in the form of inflows or enhancements of assets or decreases of liabilities that result in increases in equity, other than those relating to contributions from equity participants." Income includes <b>revenue and gains</b>.</p>
<p>Gains typically arise from <b>secondary or peripheral activities</b> (selling surplus equipment above carrying value). Gains and losses can be <b>operating</b> (a loss from a decline in inventory value) or <b>non-operating</b> (sale of non-trading investments).</p>
<h3>The core principle</h3>
<p>Revenue recognition can occur <b>independently of cash movements</b>. Under **accrual accounting**, revenue is recognised when it is <b>earned</b>: when the risk and reward of ownership is transferred, i.e., when the company delivers the goods or services.</p>
<ul><li>Delivered before cash is received → **accounts receivable** (an asset).</li><li>Cash received before delivery → **unearned revenue** (a liability).</li></ul>
<h3>Five steps in recognising revenue</h3>
<ol><li>Identify the <b>contract(s)</b> with a customer</li><li>Identify the separate or distinct **performance obligations** in the contract</li><li>Determine the **transaction price**</li><li>Allocate the transaction price to the performance obligations</li><li>Recognise revenue <b>when (or as)</b> the entity satisfies a performance obligation</li></ol>
<div class="box">Steps <b>3 and 4</b> address the <b>amount</b>; step <b>5</b> addresses the <b>timing</b>.</div>
<h3>Has the customer obtained control (point in time)? Five factors</h3>
<ul><li>Entity has a present <b>right to payment</b></li><li>Customer has <b>legal title</b></li><li>Customer has <b>physical possession</b></li><li>Customer has the <b>significant risks and rewards</b> of ownership</li><li>Customer has <b>accepted</b> the asset</li></ul>
<h3>Builder Co. worked examples</h3>
<p><b>Example 1 (performance obligations).</b> A building contract includes engineering, construction, plumbing, wiring, finishes. A good or service is <b>distinct</b> only if (1) the customer can benefit from it on its own or with readily available resources, <b>and</b> (2) the promise is <b>separately identifiable</b> from other promises in the contract. The second test fails: the customer contracted for a building, and the seller integrates everything into a combined output. → <b>One single performance obligation.</b></p>
<p><b>Example 2 (over time).</b> Price $1,000,000; expected total cost $700,000; cost incurred in year 1 $420,000.</p>
<div class="box">Progress = 420,000 ÷ 700,000 = <b>60%</b><br>Year-1 revenue = 60% × 1,000,000 = <b>$600,000</b></div>
<p>For obligations satisfied over time, revenue is recognised by <b>measuring progress</b> toward satisfying the obligation.</p>
<p><b>Example 3 (variable consideration).</b> Same facts plus a $200,000 bonus if finished within 2 years. Builder has limited experience and delays are outside its control. **Variable consideration** may be recognised only if the company can conclude it <b>will not have to reverse cumulative revenue</b> in the future. It cannot, so <b>no bonus is recognised</b>; year-1 revenue stays $600,000.</p>
<p><b>Example 4 (contract modification).</b> Start of year 2: price up $150,000, bonus deadline extended 6 months, costs up $120,000, and the bonus now qualifies.</p>
<div class="box">New transaction price = 1,000,000 + 150,000 + 200,000 = <b>$1,350,000</b><br>New total expected cost = 700,000 + 120,000 = <b>$820,000</b><br>Progress = 420,000 ÷ 820,000 = <b>51.2%</b><br>Cumulative revenue = 51.2% × 1,350,000 = $691,200<br>Additional revenue = 691,200 − 600,000 = <b>$91,200</b></div>
<p>The $91,200 is a "**cumulative catch-up adjustment**" recognised on the date of the modification. The company must update both the transaction price and the measure of progress.</p>
<p><b>Example 5 (principal vs. agent).</b> A website lets customers buy from suppliers; customers pay in advance; suppliers ship directly; the company earns a 10% commission.</p>
<div class="tw-wrap"><table><tr><th></th><th>**Principal**</th><th>**Agent**</th></tr>
<tr><td>Reports revenue</td><td><b>Gross</b> (100% of sales)</td><td><b>Net</b> (the commission only)</td></tr>
<tr><td>Signs</td><td>Primarily responsible for fulfilling; bears inventory and credit risk; sets the price</td><td>Not primarily responsible; no inventory or credit risk; no pricing discretion; paid by commission</td></tr></table></div>
<p>Here the company is an <b>agent</b> and reports only the 10% commission as revenue.</p>`,
summary:'Revenue is recorded when the company has done what it promised, not when the cash arrives. A five-step model decides how much revenue there is and when to record it; long projects record revenue in proportion to progress. Uncertain bonuses wait until they are safe from reversal, and a middleman reports only its commission.',
qs:[['List the five steps of revenue recognition and say which address amount and which address timing.','1) Identify the contract; 2) identify the distinct performance obligations; 3) determine the transaction price; 4) allocate the price to the performance obligations; 5) recognise revenue when or as each obligation is satisfied. Steps 3 and 4 address amount; step 5 addresses timing.'],
['A contractor has a $2,000,000 contract with expected total costs of $1,500,000 and incurs $450,000 in year 1. How much revenue is recognised in year 1?','Progress = 450,000 / 1,500,000 = 30%. Revenue = 30% × 2,000,000 = $600,000.'],
['Why did Builder Co. not recognise any of the $200,000 completion bonus in year 1?','Variable consideration can be recognised only if the company can conclude it will not have to reverse cumulative revenue later. With limited experience and delay factors outside its control, Builder could not reach that conclusion.'],
['Reproduce the $91,200 catch-up adjustment in Example 4.','New price = 1,000,000 + 150,000 + 200,000 = 1,350,000. New total cost = 820,000. Progress = 420,000 / 820,000 = 51.2%. Cumulative revenue = 51.2% × 1,350,000 = 691,200. Less 600,000 already recognised = 91,200.'],
['An online marketplace collects $500,000 from customers for goods shipped directly by suppliers and keeps a 10% commission. What revenue does it report and why?','$50,000. It is acting as an agent: it is not primarily responsible for fulfilment, bears no inventory or credit risk, has no pricing discretion, and is paid by commission, so it reports net.'],
['A customer pays in January for a service delivered in March. What does the company record in January?','Cash and a liability, unearned revenue. Revenue is recognised in March when the service is delivered.']]},

cues:['What is the matching principle?','What are period costs?','How do FIFO, LIFO and weighted average assign costs?','When prices rise, which method gives the lowest COGS? The highest ending inventory?','Which method does IFRS prohibit?','How are doubtful accounts and warranties handled?','Depreciation vs. amortization?','Which long-lived assets are not depreciated?','What is the straight-line formula? What two estimates drive it?','How does double-declining balance work, and what stops it?','What should an analyst watch for in these estimates?'],
notes:`<h3>What counts as an expense</h3>
<p>Expenses include <b>losses</b> as well as ordinary-course expenses (cost of sales, wages, depreciation). They usually take the form of outflows or depletion of assets (cash, inventory, property, plant and equipment). Losses, from fire or flood or disposing of non-current assets, are no different in nature from other expenses.</p>
<h3>The matching principle</h3>
<p>A company recognises expenses in the period in which it <b>consumes the economic benefits</b> of the expenditure, or loses a previously recognised benefit. Under **matching**, cost of goods sold is recognised in the <b>same period as the revenue</b> from those goods, even when the inventory was bought in an earlier period.</p>
<p>**Period costs** are less directly matched to revenues and are expensed in the period incurred (e.g., administrative expenses).</p>
<h3>Inventory methods: the KDL example</h3>
<div class="tw-wrap"><table><tr><th>Purchases in 2018</th><th>Units</th><th>Unit cost</th><th>Cost</th></tr>
<tr><td>Q1</td><td>2,000</td><td>$40</td><td>$80,000</td></tr><tr><td>Q2</td><td>1,500</td><td>$41</td><td>$61,500</td></tr><tr><td>Q3</td><td>2,200</td><td>$43</td><td>$94,600</td></tr><tr><td>Q4</td><td>1,900</td><td>$45</td><td>$85,500</td></tr>
<tr><th>Total</th><th>7,600</th><th></th><th>$321,600</th></tr></table></div>
<p>Sold 5,600 units at $50 → <b>revenue $280,000</b>. 2,000 units remain. Purchases are first recorded as inventory (an asset) and expensed when sold.</p>
<div class="tw-wrap"><table><tr><th>Method</th><th>Assumption</th><th>COGS</th><th>Ending inventory</th></tr>
<tr><td>**Specific identification**</td><td>Track the actual units (remaining: 1,900 from Q4, 100 from Q3)</td><td>$231,800</td><td>$89,800</td></tr>
<tr><td>**FIFO**</td><td>Oldest goods sold first; newest remain</td><td>2,000×40 + 1,500×41 + 2,100×43 = <b>$231,800</b></td><td>100×43 + 1,900×45 = $89,800</td></tr>
<tr><td>**Weighted-average cost**</td><td>Average cost of goods available: 321,600 ÷ 7,600 = $42.3158</td><td>5,600 × 42.3158 = <b>$236,968</b></td><td>2,000 × 42.3158 = $84,632</td></tr>
<tr><td>**LIFO**</td><td>Newest goods sold first; oldest remain. <b>Not permitted under IFRS.</b></td><td>1,900×45 + 2,200×43 + 1,500×41 = <b>$241,600</b></td><td>2,000×40 = $80,000</td></tr></table></div>
<p>Check: COGS + ending inventory always equals $321,600. (Ending inventory for specific identification, FIFO and LIFO is computed here from the slide's purchase data; the slides state it only for the average method.)</p>
<div class="tw-wrap"><table><tr><th>When prices are rising</th><th>COGS</th><th>Ending inventory</th><th>So profit is…</th></tr>
<tr><td>FIFO</td><td>Lowest</td><td>Highest</td><td>Highest</td></tr><tr><td>LIFO</td><td>Highest</td><td>Lowest</td><td>Lowest</td></tr><tr><td>Weighted average</td><td>Middle</td><td>Middle</td><td>Middle</td></tr></table></div>
<div class="warn">On the slide, both right-hand columns of this table are headed "Cost of Goods Sold". The second one is evidently <b>ending inventory</b> (FIFO highest, LIFO lowest), which matches the KDL numbers above.</div>
<h3>Other matching issues</h3>
<ul><li>**Doubtful accounts:** some customers will default, so the company records an <b>estimate</b> of uncollectible revenue.</li>
<li>**Warranties:** estimate future warranty costs, recognise the expense <b>in the period of sale</b>, and update it with experience over the warranty's life.</li>
<li>**Depreciation and amortization:** costs of long-lived assets are allocated over the period they provide benefits. <b>Not allocated:</b> <b>land</b> and <b>intangible assets with indefinite useful lives</b>.</li></ul>
<h3>Depreciation</h3>
<p>**Depreciation** is systematically allocating the cost of long-lived assets over the period they provide economic benefits. "Depreciation" is used for <b>physical</b> assets (plant, equipment); "**amortization**" for <b>intangible</b> assets with a finite life (mailing list, patent, copyright).</p>
<p>IFRS valuation models for property, plant and equipment: the **cost model** (cost less accumulated depreciation; widely used) and the **revaluation model** (fair value; <b>not permitted under US GAAP</b>).</p>
<p>Methods: **straight-line**, **diminishing balance** (accelerated depreciation), and **units of production**.</p>
<div class="box"><b>Straight-line:</b> annual depreciation = (Cost − Residual value) ÷ Estimated useful life</div>
<p>Two key estimates: <b>useful life</b> and **residual value** (salvage value: what the company expects to receive on sale at the end of the asset's useful life). For a $10,000 asset:</p>
<div class="tw-wrap"><table><tr><th>Residual</th><th>Life</th><th>Annual expense</th></tr><tr><td>$0</td><td>5 yrs</td><td>$2,000</td></tr><tr><td>$4,000</td><td>5 yrs</td><td>$1,200</td></tr><tr><td>$0</td><td>10 yrs</td><td>$1,000</td></tr></table></div>
<p>Higher residual value or longer life → lower expense → higher reported income.</p>
<p><b>Accelerated (double declining balance).</b> Cost $11,000, residual $1,000, life 5 years. Straight-line rate = 100% ÷ 5 = 20%. Acceleration factor 200% → <b>40%</b>, applied each year to the **net book value** (not to cost minus residual). Common factors are 150% and 200%.</p>
<div class="tw-wrap"><table><tr><th>Year</th><th>Opening NBV</th><th>Depreciation (40%)</th><th>Closing NBV</th></tr>
<tr><td>1</td><td>$11,000</td><td>$4,400</td><td>$6,600</td></tr><tr><td>2</td><td>$6,600</td><td>$2,640</td><td>$3,960</td></tr><tr><td>3</td><td>$3,960</td><td>$1,584</td><td>$2,376</td></tr><tr><td>4</td><td>$2,376</td><td>$950</td><td>$1,426</td></tr><tr><td>5</td><td>$1,426</td><td><b>$426</b> (not $570)</td><td>$1,000</td></tr></table></div>
<p>The asset is never depreciated <b>below its residual value</b>, so year 5 is capped at $426. Total = $10,000 either way; accelerated methods simply put more expense in the early years.</p>
<h3>Implications for financial analysis</h3>
<ul><li>Estimates for doubtful accounts and warranties, the depreciation or amortization method, useful lives and residual values all <b>affect reported net income</b>.</li>
<li>A significant <b>year-to-year change</b> in these estimates (as a percentage of sales, or in useful lives) → find out why.</li>
<li><b>Dramatically different</b> estimates between two companies in the same industry → find out why.</li>
<li>Where to look: the <b>notes</b> and the <b>MD&amp;A</b>.</li></ul>`,
summary:'Expenses are recorded in the period the related benefit is used up, so the cost of goods is matched to the sale of those goods. Because the same inventory or equipment can be costed in several acceptable ways, method and estimate choices change reported profit. A good analyst reads the notes to see which choices were made and questions sudden changes.',
qs:[['State the matching principle and explain how period costs differ.','Under matching, expenses are recognised when the associated revenues are recognised, e.g., cost of goods sold in the same period as the sale. Period costs are less directly matched to revenues and are expensed in the period incurred, e.g., administrative expenses.'],
['Using the KDL data, compute cost of goods sold under FIFO and under LIFO for 5,600 units sold.','FIFO: 2,000×40 + 1,500×41 + 2,100×43 = $231,800. LIFO: 1,900×45 + 2,200×43 + 1,500×41 = $241,600.'],
['In a period of rising prices, which inventory method reports the highest profit, and is LIFO available to an IFRS company?','FIFO reports the lowest cost of goods sold and so the highest profit (and highest ending inventory). LIFO is not permitted under IFRS.'],
['Equipment costs $50,000, residual value $5,000, useful life 9 years. What is annual straight-line depreciation?','(50,000 − 5,000) / 9 = $5,000 per year.'],
['An asset costs $11,000 with a $1,000 residual value and 5-year life. Under double declining balance, what is year-2 depreciation and why is year 5 only $426?','Rate = 2 × 20% = 40%. Year 1 = 4,400, leaving 6,600; year 2 = 40% × 6,600 = $2,640. In year 5 the net book value is 1,426; 40% would be 570 and push it below the $1,000 residual value, so only 426 is depreciated.'],
['Two airlines own similar aircraft, but one depreciates over 15 years and the other over 25. What is the effect and what should an analyst do?','The 25-year airline reports lower annual depreciation and so higher net income, even though the economics may be the same. The analyst should understand the reasons, using the notes and MD&A, and consider the difference when comparing the two.']]}
];

const kt=s=>s.replace(/\*\*(.+?)\*\*/g,'<span class="key-term">$1</span>');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

const nav=document.getElementById('nav'),main=document.getElementById('main');
let h='';
S.forEach(s=>{
  h+=`<section id="${s.id}"><h1>${s.title}</h1><div class="meta">${s.meta}</div>`;
  if(s.custom)h+=s.custom;
  else h+=`<h2>Concept outline</h2><div class="outline">${tree(s.outline)}</div><h2>Cornell notes</h2><div class="cornell"><div class="cues"><h3>Cues</h3><ul>${s.cues.map(c=>`<li>${c}</li>`).join('')}</ul></div><div class="notes">${kt(s.notes)}</div></div><div class="summary"><b>Summary.</b> ${s.summary}</div>`;
  h+='</section>';
});
